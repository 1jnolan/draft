name: Keep All Streamlit Apps Awake

on:
  schedule:
    # Runs every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  touch-all-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Touch All Python Files & Commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Update the modified timestamp on every .py file in the repository
          find . -name "*.py" -exec touch {} +
          
          git commit -am "Automated keep-alive timestamp update [skip ci]" || echo "No changes to commit"
          git push
          
